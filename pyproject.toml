[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "searendipity"
version = "0.1.0"
description = "The serendipitous NationStates recruitment and analytics suite"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Searendipity Contributors" }
]
license = { text = "BSD-2-Clause" }
keywords = ["nationstates", "recruitment", "discord-bot", "analytics", "sse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "discord.py>=2.5.0",
    "sans>=1.3.5",
    "jinja2>=3.1.5",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "progress>=1.6.0",
    "rich>=13.0.0",
]

[project.scripts]
searendipity = "searendipity:main"
genreport = "genreport:main"
